services:
  client:
    image: aarish96/my-client:latest
    ports:
      - "3000:3000"
    depends_on:
      - server

  server:
    image: aarish96/my-server:latest
    ports:
      - "5000:5000"
    env_file:
      - ./server/.env
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: practice
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d practice"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: