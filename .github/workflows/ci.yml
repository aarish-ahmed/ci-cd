name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install server dependencies
        working-directory: ./server
        run: npm ci

      - name: Install client dependencies
        working-directory: ./client
        run: npm ci

      - name: Build client
        working-directory: ./client
        env:
          CI: "true"
          NEXT_TELEMETRY_DISABLED: 1
        run: npm run build

      - name: build client docker image
        run: docker build -t my-client ./client

      - name: build server docker image
        run: docker build -t my-server ./server

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build client Docker image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/my-client:latest ./client

      - name: Build server Docker image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/my-server:latest ./server

      - name: Push client image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/my-client:latest

      - name: Push server image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/my-server:latest